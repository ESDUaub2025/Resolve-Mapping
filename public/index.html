<!doctype html>
<html lang="en" dir="ltr">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
	<meta name="description" content="RESOLVE: agricultural survey summaries, fire detections and protected areas for Mount Lebanon and the Beqaa, Lebanon.">
	<title>RESOLVE Map</title>
	<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><circle cx='50' cy='50' r='40' fill='%232e7d5b'/></svg>">
	<link rel="stylesheet" href="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.css"
		integrity="sha384-MinO0mNliZ3vwppuPOUnGa+iq619pfMhLVUXfC4LHwSCvF9H+6P/KO4Q7qBOYV5V" crossorigin="anonymous">
	<link rel="stylesheet" href="css/style.css">
</head>
<body>
	<header class="topbar">
		<button id="toggle-panel" class="icon-btn" aria-controls="panel" aria-expanded="true" data-i18n-title="layers">
			<svg width="20" height="20" viewBox="0 0 24 24" aria-hidden="true"><path d="M3 6h18M3 12h18M3 18h18" stroke="currentColor" stroke-width="2" fill="none"/></svg>
		</button>
		<h1 class="title" data-i18n="title">RESOLVE Map</h1>
		<button id="toggle-lang" class="text-btn" data-i18n="switchLang">العربية</button>
	</header>
	<div id="tier-banner" class="tier-banner" hidden></div>

	<main class="layout">
		<aside id="panel" class="panel" aria-label="Layers">
			<section>
				<h2 data-i18n="layers">Layers</h2>
				<div id="layer-list" class="layer-list"></div>
			</section>
			<section>
				<h2 data-i18n="basemap">Base map</h2>
				<div id="basemaps" class="basemaps" role="radiogroup"></div>
			</section>
			<p class="muted small" data-i18n="privacyNote"></p>
		</aside>

		<div id="map" class="map" role="region" aria-label="Map"></div>

		<aside id="details" class="details" aria-labelledby="details-title" hidden>
			<div class="details-head">
				<h2 id="details-title"></h2>
				<button id="details-close" class="icon-btn" data-i18n-title="close" aria-label="Close">×</button>
			</div>
			<div id="details-body" class="details-body"></div>
		</aside>
	</main>

	<div id="status" class="status" role="status" aria-live="polite"></div>

	<script src="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.js"
		integrity="sha384-SYKAG6cglRMN0RVvhNeBY0r3FYKNOJtznwA0v7B5Vp9tr31xAHsZC0DqkQ/pZDmj" crossorigin="anonymous"></script>
	<script type="module" src="js/main.js"></script>
</body>
</html>
