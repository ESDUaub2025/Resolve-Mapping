nodes:
- id: RESOLVEMAPING_FINAL2
  type: PROJECT
  title: RESOLVE Mapping Platform
  summary: Lebanon agricultural/environmental GIS map (static site on GitHub Pages).
- id: SYS_DATA_PIPELINE
  type: SYSTEM
  title: Data pipeline
  summary: Offline Python processing from raw sources to published datasets.
- id: SYS_WEB_MAP
  type: SYSTEM
  title: Web map
  summary: Static MapLibre GL frontend (no build step).
- id: SYS_PUBLIC_RELEASE
  type: SYSTEM
  title: Public release
  summary: Everything GitHub Pages serves to anonymous users.
- id: CFG_PROJECT_MANIFESTS
  type: CONFIG
  title: Project manifests
  summary: Python dependency manifest (currently unpinned).
  artifacts:
  - requirements.txt
- id: CMP_SCRIPTS
  type: COMPONENT
  title: Legacy processing scripts
  summary: Active and archived one-off scripts; replaced by the adapter pipeline in Stage 3. Removed 2026-09-29; kept in git
    history.
  tags:
  - legacy
  confidence: medium
- id: CMP_APP_SHELL
  type: COMPONENT
  title: App shell and main logic
  summary: index.html, app.js (layers, popups, filters, i18n, legend), style.css; decomposed in Stage 6. Removed 2026-09-29;
    kept in git history.
  tags:
  - legacy
  confidence: medium
- id: CMP_APP_MODULES
  type: COMPONENT
  title: App modules
  summary: loader, store, property-schemas, and the unused filter-engine. Removed 2026-09-29; kept in git history.
  tags:
  - legacy
  confidence: medium
- id: CMP_APP_CONFIG
  type: COMPONENT
  title: Layer manifest
  summary: app/config/manifest.js layer registry (to become a generated catalog). Removed 2026-09-29; kept in git history.
  tags:
  - legacy
  confidence: medium
- id: DATA_PUBLISHED_GEOJSON
  type: DATA
  title: Published GeoJSON
  summary: Files the browser loads; currently under data/geojson/. Removed 2026-09-29; kept in git history.
  confidence: medium
  tags:
  - legacy
- id: CMP_PIPELINE
  type: COMPONENT
  title: resolve pipeline
  summary: Adapters, validation, disclosure control, releases (python -m resolve).
  artifacts:
  - resolve/**
- id: CMP_DICTIONARY
  type: COMPONENT
  title: Field dictionary and gazetteer
  summary: dictionary/*.yaml (fields, vocabularies, instruments, dataset cards) and ref/*.csv (localities).
  artifacts:
  - dictionary/**
  - ref/**
- id: CMP_ML_RESEARCH
  type: COMPONENT
  title: Withdrawn ML experiments
  summary: Former AI layers; not published, not maintained.
  tags:
  - withdrawn
  artifacts:
  - research/**
- id: CMP_WEB_APP
  type: COMPONENT
  title: Registry-driven web map
  summary: 'public/index.html, public/js, public/css: generic MapLibre app driven by catalog.json.'
  artifacts:
  - public/index.html
  - public/js/**
  - public/css/**
- id: DATA_PUBLIC_RELEASE
  type: DATA
  title: Public release
  summary: 'public/data: catalog.json + content-hashed GeoJSON (disclosure-controlled).'
  artifacts:
  - public/data/**
- id: CFG_CI
  type: CONFIG
  title: CI and packaging
  summary: GitHub Actions test+deploy (only public/), pinned requirements, pytest config.
  artifacts:
  - .github/workflows/**
  - pytest.ini
  - requirements.txt
  - requirements-dev.txt
  - .gitattributes
  - .gitignore
