nodes:
- id: M0_CONTAINMENT
  type: MILESTONE
  title: Stage 0 - Containment
  summary: Remove PII, survey-derived and ML data from the public site and git history; site keeps fire + protected areas.
- id: M1_SCAFFOLDING
  type: MILESTONE
  title: Stage 1 - Baseline and scaffolding
  summary: Private/public split, pinned deps, CI, Pages deployed from public/, baseline metrics.
- id: M2_DICTIONARY
  type: MILESTONE
  title: Stage 2 - Field dictionary, vocabularies, gazetteer
- id: M3_ADAPTERS
  type: MILESTONE
  title: Stage 3 - Adapters to staging with lineage
- id: M4_CANONICAL
  type: MILESTONE
  title: Stage 4 - Validation and canonical tier
- id: M5_PUBLISH_SDC
  type: MILESTONE
  title: Stage 5 - Publishing with statistical disclosure control
- id: M6_FRONTEND_REGISTRY
  type: MILESTONE
  title: Stage 6 - Registry-driven frontend
- id: M7_GIS_UX
  type: MILESTONE
  title: Stage 7 - GIS and UX corrections
- id: M8_RESEARCH_TIER
  type: MILESTONE
  title: Stage 8 - Research tier and ML (optional)
- id: TST_NO_RESTRICTED_DATA_TRACKED
  type: TEST
  title: Privacy invariant - no restricted survey data tracked or served
  summary: Scans tracked files for survey PII columns, phone numbers and forbidden paths.
  artifacts:
  - tests/privacy/**
- id: TST_TEST_SUITE
  type: TEST
  title: Full automated test suite (CI gate)
  artifacts:
  - tests/**
  - pytest.ini
- id: TST_DICTIONARY
  type: TEST
  title: Dictionary, vocabulary and text-normalization tests
  artifacts:
  - tests/test_dictionary.py
  - tests/test_textnorm.py
- id: TST_PIPELINE_REPRODUCIBLE
  type: TEST
  title: Public release rebuilds byte-identically from the private raw store
- id: TST_CANONICAL_VALID
  type: TEST
  title: Canonical records pass all critical validation rules
- id: TST_PUBLIC_RELEASE
  type: TEST
  title: Public release and disclosure-control invariants
  artifacts:
  - tests/test_public_release.py
  - tests/test_sdc.py
- id: TST_FRONTEND
  type: TEST
  title: Frontend is generic, injection-free, pinned and bilingual
  artifacts:
  - tests/test_frontend.py
- id: TST_MAP_E2E
  type: TEST
  title: End-to-end browser test of the public map
  artifacts:
  - tests/e2e/**
- id: TST_RESEARCH_TIER
  type: TEST
  title: Local research release with identities builds
